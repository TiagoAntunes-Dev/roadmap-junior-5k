<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chapter 8 - Styling Lists and Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Estilizando Listas e Links</h1>

  <h2>Lista não ordenada normal</h2>
  <ul class="lista-normal">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>

  <h2>Lista usada como menu de navegação</h2>
  <nav>
    <ul class="menu-nav">
      <li><a href="#">Início</a></li>
      <li><a href="#">Sobre</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  </nav>

  <h2>Link com todos os estados</h2>
  <a href="https://developer.mozilla.org" class="link-estilizado">Visite o MDN</a>

</body>
</html>
