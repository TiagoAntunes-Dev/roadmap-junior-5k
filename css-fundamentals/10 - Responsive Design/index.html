<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- ESSENCIAL pra responsividade funcionar em celular!
       Sem essa tag, o navegador mobile finge que a tela é "desktop" (~980px)
       e depois encolhe tudo, o que faz o layout ficar minúsculo e errado. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapter 10 - Responsive Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Design Responsivo</h1>
  <p>Redimensione a janela do navegador (ou abra em modo celular) pra ver o layout mudar.</p>

  <div class="container">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>

  <img class="imagem-responsiva" src="https://via.placeholder.com/800x400" alt="Imagem de exemplo responsiva">

</body>
</html>
